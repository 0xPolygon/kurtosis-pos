name: setup
description: Set up Docker authentication and Kurtosis environment

inputs:
  # Dependency versions
  foundry_version:
    description: The version of Foundry to install
    required: false
    default: v1.9.0
  python_version:
    description: The version of Python to install
    required: false
    default: 3.14

  # Docker hub registry credentials
  docker_username:
    description: The username for docker hub registry
    required: false
  docker_token:
    description: The token for docker hub registry
    required: false

  # GCP settings
  gcp_registry:
    description: Container registry url
    required: false
    default: europe-west2-docker.pkg.dev
  gcp_project_id:
    description: Project id
    required: false
    default: prj-polygonlabs-devtools-dev
  gcp_repository:
    description: Artifact repository name
    required: false
    default: virtual
  gcp_wip:
    description: Workload identity provider
    required: false
    default: projects/337907489413/locations/global/workloadIdentityPools/github-wif/providers/github
  gcp_sa:
    description: Service account
    required: false
    default: kurtosis-pos-ci@prj-polygonlabs-devtools-dev.iam.gserviceaccount.com

  # Cache settings
  cache_key:
    description: The key to use for caching Docker images
    required: false
    default: docker-images
  # Not /tmp: ubuntu-26.04 runners mount it as a tmpfs that the image tarballs overflow.
  cache_folder:
    description: The folder to use for caching Docker images (defaults to <runner.temp>/docker-images)
    required: false
    default: ""
  main_branch:
    description: The name of the main branch for cache keys
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Free up disk space
      shell: bash
      # Removes preinstalled toolchains (Android, .NET, Haskell) and GitHub's preloaded images, ~24 GB.
      # Must run before the image cache is restored.
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
        docker image prune --all --force > /dev/null
        df -h /

    # Install dependencies
    - name: Install kurtosis
      id: kurtosis
      uses: 0xPolygon/kurtosis-workflows/.github/actions/setup-kurtosis@v0.1.5

    - name: Install yq
      shell: bash
      run: |
        pip3 install yq
        yq --version

    - name: Install foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ inputs.foundry_version }}
        cache: true
        # Key the cache by foundry version (not the default job+sha) so all matrix
        # jobs share one entry and a given version is only downloaded once. Avoids
        # hammering foundry's CDN on every run, which 504s intermittently.
        cache-key: foundry-${{ inputs.foundry_version }}-${{ runner.os }}
        cache-restore-keys: foundry-${{ inputs.foundry_version }}-

    # Login to registries
    - name: Login to docker hub registry
      if: ${{ inputs.docker_username && inputs.docker_token }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Login to github container registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # Load images from cache or pull from GAR
    - uses: actions/cache@v5
      id: cache
      with:
        path: ${{ inputs.cache_folder || format('{0}/docker-images', runner.temp) }}
        key: ${{ inputs.cache_key }}-${{ inputs.main_branch }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.cache_key }}-${{ inputs.main_branch }}-

    - name: Load cached docker images
      if: steps.cache.outputs.cache-matched-key != 'true'
      shell: bash
      env:
        CACHE_FOLDER: ${{ inputs.cache_folder || format('{0}/docker-images', runner.temp) }}
      run: |
        echo "Loading cached images..."
        if [[ -d "$CACHE_FOLDER" ]]; then
          for image_tar in "$CACHE_FOLDER"/*.tar; do
            if [[ -f "$image_tar" ]]; then
              {
                docker load -i "$image_tar"
              } &
            fi
          done
          wait
          echo "Cached images loaded successfully"
        fi

    - name: List images
      if: steps.cache.outputs.cache-matched-key != 'true'
      shell: bash
      run: docker images

    # Pull images from GAR if cache miss
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}
      with:
        workload_identity_provider: ${{ inputs.gcp_wip }}
        service_account: ${{ inputs.gcp_sa }}

    - name: Setup gcloud cli
      uses: google-github-actions/setup-gcloud@v3.0.1
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}

    - name: Configure docker
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}
      shell: bash
      run: gcloud auth configure-docker ${{ inputs.gcp_registry }}

    - name: Install python
      uses: actions/setup-python@v6
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}
      with:
        python-version: ${{ inputs.python_version }}

    - name: Add registry prefix to image names
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}
      shell: bash
      run: |
        registry_prefix=${{ inputs.gcp_registry }}/${{ inputs.gcp_project_id }}/${{ inputs.gcp_repository }}
        python3 .github/actions/kurtosis/setup/add-registry-prefix.py --registry-prefix $registry_prefix

    # Images of kurtosis-pos, already prefixed with the registry
    - name: Pull kurtosis-pos images from GAR
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}
      uses: 0xPolygon/kurtosis-workflows/.github/actions/pull-images@v0.1.5
      with:
        images_file: modified-images.txt
        skip_present: true

    # Kurtosis core and ethereum-package images, tagged back to their original names
    - name: Pull kurtosis core and ethereum-package images from GAR
      if: ${{ steps.cache.outputs.cache-matched-key != 'true' }}
      uses: 0xPolygon/kurtosis-workflows/.github/actions/pull-kurtosis-images@v0.1.5
      with:
        kurtosis_version: ${{ steps.kurtosis.outputs.version }}
        registry_prefix: ${{ inputs.gcp_registry }}/${{ inputs.gcp_project_id }}/${{ inputs.gcp_repository }}
        skip_present: true

    # Debug
    - name: List images
      shell: bash
      run: docker images
