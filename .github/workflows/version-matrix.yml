name: version-matrix

on:
  schedule:
    - cron: 0 4 * * 1 # Monday 04:00 UTC, i.e. 6 AM Paris in summer (5 AM in winter), so the bump PR lands before the workday.
  push: # TEMP: test run, to revert
    branches: [ci/weekly-version-matrix]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVTOOLS_SLACK_ALERTS_CHANNEL_ID: C04DS0SG599

jobs:
  # Detect dependencies that have fallen behind their upstream releases. An
  # upstream release is not a failure of this repo, so the job never fails the
  # workflow — it reports the drift and the summary relays it.
  check-version-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      # `continue-on-error` reports the job as successful, so the drift verdict
      # has to travel to the summary as an output rather than a job result.
      # Empty when an earlier step (pip install, extract-versions.py,
      # generate-markdown.py) failed and `check` never ran — the summary treats
      # that as "did not complete" rather than as "up to date".
      outdated: ${{ steps.check.outputs.outdated }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.13

      # Includes rumdl, which generate-markdown.py uses to align its tables.
      - name: Install dependencies
        run: pip install -r scripts/version-matrix/requirements.txt

      - name: Generate version matrix
        env:
          # Only needs to read public releases, so the default token is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/version-matrix/extract-versions.py

      - name: Generate markdown documentation
        run: python3 scripts/version-matrix/generate-markdown.py

      - name: Check the committed matrix is up to date
        id: check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=version-matrix::Version matrix is outdated. Check the documentation at scripts/version-matrix to update it."
            echo "❌ Version matrix is out of date:"
            git diff --stat
            git diff
            exit 1
          fi
          echo "outdated=false" >> "$GITHUB_OUTPUT"
          echo "✅ Version matrix is up to date"

  bump-version-matrix:
    needs: check-version-matrix
    if: needs.check-version-matrix.outputs.outdated == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/bump-version-matrix.yml
    secrets: inherit

  workflow-summary:
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'push' # TEMP: no Slack during the test run
    needs:
      - check-version-matrix
      - bump-version-matrix
    permissions:
      actions: read
    steps:
      - name: Build the Slack message
        id: message
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          OUTDATED: ${{ needs.check-version-matrix.outputs.outdated }}
          BUMP_RESULT: ${{ needs.bump-version-matrix.result }}
          PR_OPERATION: ${{ needs.bump-version-matrix.outputs.pr-operation }}
          PR_URL: ${{ needs.bump-version-matrix.outputs.pr-url }}
        run: |
          # Links are a bonus: an API error must not cost the Slack message.
          jobs=$(gh api --paginate "$JOBS_API" --jq '.jobs[]') || jobs=""

          # Slack link to the first job whose name starts with $1, labelled $2.
          job_link() {
            local url
            url=$(jq -rs --arg p "$1" 'map(select(.name | startswith($p)))[0].html_url // ""' <<< "$jobs")
            if [[ -n "$url" ]]; then echo "<$url|$2>"; else echo "$2"; fi
          }

          pr="<$PR_URL|#${PR_URL##*/}>"
          if [[ "$OUTDATED" == false ]]; then
            matrix="up to date ✅"
          elif [[ "$OUTDATED" != true ]]; then
            matrix="unknown ⚠️, the $(job_link check-version-matrix 'check job') failed before it could compare the matrix"
          elif [[ "$PR_OPERATION" == created ]]; then
            matrix="outdated ❌, bump PR opened: $pr"
          elif [[ "$PR_OPERATION" == updated ]]; then
            matrix="outdated ❌, bump PR refreshed: $pr"
          elif [[ "$BUMP_RESULT" != success ]]; then
            matrix="outdated ❌, the $(job_link bump-version-matrix 'bump job') failed"
          elif [[ -n "$PR_URL" ]]; then
            matrix="outdated ❌, nothing new to bump, $pr is still open"
          else
            matrix="outdated ❌, nothing to bump (pinned, pre-release or unpublished), see the $(job_link check-version-matrix drift)"
          fi

          echo "text=<$RUN_URL|Kurtosis PoS version matrix>: $matrix" >> "$GITHUB_OUTPUT"

      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            {
              "channel": ${{ env.DEVTOOLS_SLACK_ALERTS_CHANNEL_ID }},
              "text": "Kurtosis PoS version matrix",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.message.outputs.text) }}
                  }
                }
              ]
            }
