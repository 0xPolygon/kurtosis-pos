name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/lint.yml@f09a1aa74beca7ce49980e9a67291f97bdd4eb5d # v0.1.4

  package-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: 0xPolygon/kurtosis-workflows/.github/actions/verify-package-pins@f09a1aa74beca7ce49980e9a67291f97bdd4eb5d # v0.1.4

  unit:
    permissions:
      contents: read
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/unit.yml@f09a1aa74beca7ce49980e9a67291f97bdd4eb5d # v0.1.4

  devnet-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/devnet-monitor/go.mod
          cache-dependency-path: tools/devnet-monitor/go.sum

      - name: go vet
        working-directory: tools/devnet-monitor
        run: go vet ./...

      - name: go test
        working-directory: tools/devnet-monitor
        run: go test ./...
