name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/lint.yml@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5

  package-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: 0xPolygon/kurtosis-workflows/.github/actions/verify-package-pins@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5

      - uses: 0xPolygon/kurtosis-workflows/.github/actions/verify-images@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5

  unit:
    permissions:
      contents: read
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/unit.yml@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5

  devnet-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/devnet-monitor/go.mod
          cache-dependency-path: tools/devnet-monitor/go.sum

      - name: go vet
        working-directory: tools/devnet-monitor
        run: go vet ./...

      - name: go test
        working-directory: tools/devnet-monitor
        run: go test ./...
