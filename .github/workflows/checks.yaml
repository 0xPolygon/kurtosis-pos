name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/lint.yml@1d7acffacfb81187c58553013051b05304838b81
    with:
      kurtosis_version: 1.23.0
      markdown_paths: .
      typos: true
      shfmt_version: 3.13.1

  package-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Verify external package pins
        run: python3 scripts/version-matrix/verify-package-pins.py

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KURTOSIS_TEST_VERSION: v0.0.11

    steps:
      - uses: actions/checkout@v7

      - name: Install kurtosis-test
        run: |
          curl -sSfL "https://github.com/leovct/kurtosis-test/releases/download/${KURTOSIS_TEST_VERSION}/kurtosis-test_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kurtosis-test

      - name: Run unit tests
        run: kurtosis-test .

  devnet-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/devnet-monitor/go.mod
          cache-dependency-path: tools/devnet-monitor/go.sum

      - name: go vet
        working-directory: tools/devnet-monitor
        run: go vet ./...

      - name: go test
        working-directory: tools/devnet-monitor
        run: go test ./...
