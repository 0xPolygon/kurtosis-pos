name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/docs.yml@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5
