name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/docs.yml@1d7acffacfb81187c58553013051b05304838b81
    with:
      node_version: 24.22.1
      typecheck: true
      deploy: ${{ github.ref == 'refs/heads/main' }}
