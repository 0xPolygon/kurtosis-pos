name: perf-report

# Fan-in workflow. Triggered after `deploy` or `snapshot` complete (any
# conclusion). Downloads perf-* artifacts from the upstream run, compares
# against the last 10 successful main runs of the same workflow, and either
# posts a sticky PR comment (for PR-triggered runs) or uploads the rendered
# Markdown as an artifact (for push-to-main runs).
on:
  workflow_run:
    workflows: [deploy, snapshot]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run always executes here in the base repo, with this repo's
    # workflow file and a pull-requests:write token — even when the upstream
    # `deploy` run was a fork PR executing the fork's copy of deploy.yaml.
    # Such a run can upload arbitrary kurtosis-pos-perf-* artifacts, so skip
    # it: `head_repository` is the repo the upstream run's code came from.
    # (`workflow_run.repository` is always this repo, so comparing it to
    # github.repository is a no-op.) Fork PRs therefore get no perf comment.
    # Cancelled runs (superseded by a newer push) still upload perf artifacts
    # with no phases, which would replace the last useful comment with an
    # empty report.
    if: >-
      ${{
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion != 'cancelled'
      }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this workflow pushes. Keep GITHUB_TOKEN out of
          # .git/config so a bug in the artifact parsing below can't reach it.
          persist-credentials: false

      # The built-in actions/download-artifact does not support cross-workflow
      # downloads, so the script goes through the GitHub API via gh.
      - name: Download current-run perf artifacts
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ./scripts/perf/fetch-reports.sh run "$RUN_ID" tmp/perf-current
          if compgen -G "tmp/perf-current/*.json" > /dev/null; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "No perf-* artifacts on upstream run ${RUN_ID} — exiting."
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve baseline runs
        if: steps.download.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
        # Last 10 successful main runs of the same workflow, excluding the
        # triggering run in case this is itself a main push.
        run: ./scripts/perf/fetch-reports.sh baseline "$WORKFLOW_NAME" "$CURRENT_SHA" tmp/perf-baseline

      - name: Render report
        if: steps.download.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p tmp/perf-out
          python3 scripts/perf/report.py \
            --current tmp/perf-current \
            --baseline tmp/perf-baseline \
            --output tmp/perf-out/report.md \
            --source "${{ github.event.workflow_run.name }}"
          # Durations first, for every job of the upstream run (all done by now).
          # Best-effort: an API error here must not cost the perf comment.
          { ./scripts/perf/job-durations.sh "$RUN_ID" || echo "::warning::Could not list the job durations" >&2; } |
            cat - tmp/perf-out/report.md > tmp/perf-out/combined.md
          mv tmp/perf-out/combined.md tmp/perf-out/report.md

      - name: Resolve PR number
        id: pr
        if: steps.download.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          # workflow_run carries no PR number. Look it up by head_sha for any
          # event whose head sits on a branch with an open PR — covers both
          # PR-triggered runs and manual workflow_dispatch on a PR branch.
          # Returns empty for push-to-main runs, which we treat as "no PR to
          # comment on".
          pr=""
          if [[ "$EVENT" == "pull_request" || "$EVENT" == "workflow_dispatch" ]]; then
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '.[] | select(.state == "open") | .number' | head -n 1)
          fi
          echo "number=${pr}" >> "$GITHUB_OUTPUT"
          echo "Resolved PR: ${pr:-<none>}"

      - name: Post sticky PR comment
        if: steps.download.outputs.has_artifacts == 'true' && steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ steps.pr.outputs.number }}
          header: ci-perf-report-${{ github.event.workflow_run.name }}
          path: tmp/perf-out/report.md
          # Delete the previous report and post a fresh comment at the bottom
          # of the thread, so each run is visible without scrolling back to an
          # edited comment.
          recreate: true

      - name: Upload rendered report as artifact
        if: steps.download.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kurtosis-pos-perf-report-${{ github.event.workflow_run.id }}
          path: tmp/perf-out/report.md
          retention-days: 30
