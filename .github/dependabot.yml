version: 2

multi-ecosystem-groups:
  all-deps:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-deps

  - package-ecosystem: docker
    directory: docker
    patterns:
      - "*"
    multi-ecosystem-group: all-deps

  - package-ecosystem: npm
    directory: docs
    patterns:
      - "*"
    multi-ecosystem-group: all-deps
