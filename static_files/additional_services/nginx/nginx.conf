# nginx least-connections load balancer in front of all bor (L2 EL) nodes
# except stateless-sync ones (their txpool is disabled, so they can't accept
# transactions): one JSON-RPC endpoint at the root path on the rpc port. Unlike erpc, which
# uses scored selection with a sticky primary (all traffic concentrates on one
# upstream until it degrades), least_conn actively spreads concurrent requests
# across every node. That matters for long-held calls like
# eth_sendRawTransactionSync (EIP-7966), which park an RPC execution-pool slot
# on the serving node until the receipt lands: least_conn engages every node's
# pool at once instead of saturating a single one.
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    # Devnet load-balancer: skip access logging to keep the proxy cheap under
    # load-test traffic. Errors still go to stderr via the image default.
    access_log off;

    upstream bor {
        least_conn;
        {{- range $name, $host := .Upstreams }}
        server {{ $host }};
        {{- end }}
        # Reuse upstream connections instead of opening one per request.
        keepalive 512;
    }

    server {
        listen {{ .RpcPort }};

        location / {
            proxy_pass http://bor;
            # keepalive upstreams require HTTP/1.1 with no Connection header.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            # eth_sendRawTransactionSync legitimately holds a request for its
            # full sync timeout (bor default 20s, clamped by
            # --rpc.txsync.maxtimeout); keep read/send timeouts well above it.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # Fail over to another upstream only on connection errors, never
            # after any part of a request reached a node: replaying a JSON-RPC
            # POST (e.g. a raw tx broadcast) could double-submit.
            proxy_next_upstream error;
        }
    }
}
