# Minimal pos-gateway config for the devnet: one network mounted at
# /devnet (and /<chain_id>), load-balanced over the bor nodes, with no billing
# database. Every request needs an access key; the devnet ships `admin` (all
# products) and `limited` (`lls_idx` only), sent as X-Access-Key / X-Api-Key or ?key=.
env    = "local"
listen = "0.0.0.0:{{ .Port }}"
mode   = "local"

[logging]
  service      = "pos-gateway"
  level        = "INFO"
  http_level   = "INFO"
  concise      = true
  req_headers  = false
  resp_headers = false

[cache]
  enabled = true
  use_singleflight = true
  only_methods = ["net_version", "eth_chainId"]

  [cache.memory]
    lru_size = 50_000

[networks]
  [networks.{{ .NetworkName }}]
    chain_id = {{ .ChainId }}
    finality = 120
    testnet  = true

    [[networks.{{ .NetworkName }}.api_keys]]
      key        = "admin"
      label      = "admin"
      project_id = 1
      products   = ["pm", "lls_tx", "lls_idx"]

    [[networks.{{ .NetworkName }}.api_keys]]
      key        = "limited"
      label      = "limited"
      project_id = 2
      products   = ["lls_idx"]
    {{- range $name, $url := .Upstreams }}

    [[networks.{{ $.NetworkName }}.endpoints]]
      label = "{{ $name }}"
      url   = "{{ $url }}"
    {{- end }}

[health_check]
  enabled = true
  consistency = true
  max_block_lag = 1
  period = "15s"
  timeout = "5s"
  failure_threshold = 2
  success_threshold = 1
  faultgauge_fail_rate_threshold = 0.10

[networks.{{ .NetworkName }}.access_key_capabilities]
policy_version = 1

[networks.{{ .NetworkName }}.access_key_capabilities.method_products]
eth_getBlockByNumber = []
eth_getBlockTransactionCountByNumber = []
eth_getLogs = []
eth_getStorageAt = []
eth_getTransactionByHash = []
eth_getTransactionReceipt = []
eth_chainId = []
net_version = []
eth_getBlockByHash = []
eth_getBlockTransactionCountByHash = []
eth_getTransactionByBlockHashAndIndex = []
web3_clientVersion = []
debug_traceBlockByNumber = []
debug_traceBlockByHash = []
debug_traceTransaction = []
eth_protocolVersion = []
eth_blockNumber = []
eth_estimateGas = []
eth_gasPrice = []
eth_maxPriorityFeePerGas = []
eth_getBalance = []
eth_getCode = []
eth_getTransactionCount = []
eth_feeHistory = []
eth_getProof = []
eth_call = []
eth_createAccessList = []
eth_simulateV1 = []
eth_getTransactionByBlockNumberAndIndex = []
eth_sendRawTransaction = ["pm", "lls_tx"]
eth_sendRawTransactionSync = ["lls_tx"]
eth_sendRawTransactionPrivate = ["pm"]
eth_checkPreconfStatus = ["pm"]
bor_getInvalidPreconfBlocks = ["lls_tx", "lls_idx"]
seq_chainHealth = []

[networks.{{ .NetworkName }}.access_key_capabilities.metering_products]
"eth_sendRawTransactionPrivate" = ["pm"]
"eth_sendRawTransactionSync" = ["lls_tx"]
"eth_sendRawTransaction" = ["lls_tx", "pm"]
"eth_getTransactionReceipt" = ["lls_tx"]
"eth_getLogs.pending" = ["lls_idx"]
