# Minimal pos-gateway config for the devnet: one network mounted at
# /devnet (and /<chain_id>), load-balanced over the bor nodes, with no billing
# database and no access-key enforcement.
env    = "local"
listen = "0.0.0.0:{{ .Port }}"
mode   = "local"

[logging]
  service      = "pos-gateway"
  level        = "INFO"
  http_level   = "INFO"
  concise      = true
  req_headers  = false
  resp_headers = false

[cache]
  enabled = true
  use_singleflight = true
  only_methods = ["net_version", "eth_chainId"]

  [cache.memory]
    lru_size = 50_000

[networks]
  [networks.{{ .NetworkName }}]
    chain_id = {{ .ChainId }}
    finality = 120
    testnet  = true
    {{- range $name, $url := .Upstreams }}

    [[networks.{{ $.NetworkName }}.endpoints]]
      label = "{{ $name }}"
      url   = "{{ $url }}"
    {{- end }}
